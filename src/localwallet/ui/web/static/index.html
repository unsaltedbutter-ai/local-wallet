<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Wallet</title>
<link rel="icon" href="/favicon.ico" type="image/vnd.microsoft.icon">
<link rel="stylesheet" href="/static/styles.css">
<script type="module" src="/static/app.js"></script>
<!-- the per-launch token island is injected here by the server (TCK-WEB-002) -->
</head>
<body>
<header class="bar">
  <h1 class="brand">Local Wallet</h1>
  <!-- TCK-WEB-005: honest scan status, driven ONLY by the typed /state snapshot's
       scan_state field (never inferred from dots). Hidden until a snapshot says so. -->
  <p id="scan-chip" class="chip" role="status" aria-live="polite" hidden></p>
  <p id="conn-status" class="status" role="status" aria-live="polite" data-state="connecting">Connecting…</p>
  <button id="settings-toggle" class="btn btn-ghost" type="button" aria-expanded="false" aria-controls="settings-panel">Settings</button>
</header>

<!-- TCK-WEB-009 (h): header balance action BELOW the top bar. Model-free
     bypass action riding the pump's canonical slash utterance through
     POST /action (the same full-pipeline path every button takes). Copy
     pass 2 #14: ONE Balance button — the old BTC/USD pair sent the identical
     "/balance" utterance (the engine offers no separate USD one and never
     gets an invented endpoint); the card it renders carries BTC/sats + USD
     + the rate timestamp. Hidden pre-provision; shown ONLY from the typed
     /state snapshot (never inferred). -->
<nav id="quickbar" class="quickbar" aria-label="Balance actions" hidden>
  <button type="button" class="btn btn-secondary btn-small" data-action="quick-balance" data-utterance="/balance" title='Sends "/balance"'>Balance</button>
</nav>

<!-- TCK-WEB-009 (a): the settings pane is the ONLY first-run surface — the
     separate "Connect your wallet" card is gone; its entry logic (POST
     /watchkey incl. the replace/confirm rung) lives in the pane's zpub
     section. Rows are built by app.js from GET /settings (textContent-only)
     in the fixed order: wallet zpub, chain base url, gap limit. Values live
     only in this DOM: never logged, never persisted client-side. -->
<section id="settings-panel" class="settings" aria-label="Settings" hidden>
  <p id="settings-status" class="settings-status" role="status" aria-live="polite"></p>
  <div id="settings-list" class="settings-cols"></div>
</section>

<main id="scroller" class="transcript-region">
  <ol id="transcript" class="transcript" aria-label="Wallet conversation">
    <li id="hint" class="turn turn-system">Messages you send and replies from your wallet appear here.</li>
  </ol>
</main>

<footer class="bar bar-compose">
  <form id="turn-form" class="compose" autocomplete="off">
    <label class="visually-hidden" for="turn-text">Message</label>
    <input id="turn-text" name="text" type="text" placeholder="Ask your wallet…" maxlength="4096" required>
    <button id="turn-send" class="btn btn-primary" type="submit">Send</button>
  </form>
  <!-- TCK-UX-008: animated 3-dot in-flight pulse beside the label — pure CSS
       keyframes (styles.css), no JS interval, aria-hidden static decoration
       that show/hides with the parent via setBusy(). -->
  <p id="turn-busy" class="meta" hidden>Working…<span class="busy-dots" aria-hidden="true"><span></span><span></span><span></span></span></p>
  <!-- TCK-WEB-004: action buttons (labels are designer-owned copy). Each click is the
       user's second key: its data-utterance (a canonical engine phrase) is POSTed to
       /action and runs the FULL turn pipeline, exactly like typing it. Visibility is
       driven only by the typed GET /state snapshot; all hidden until one arrives. -->
  <section id="actions" aria-label="Flow actions">
    <button type="button" class="btn btn-primary" data-action="confirm" data-utterance="confirm" title='Sends "confirm"' hidden>Confirm</button>
    <button type="button" class="btn btn-primary" data-action="sign" data-utterance="sign" title='Sends "sign"' hidden>Sign</button>
    <button type="button" class="btn btn-danger" data-action="cancel" data-utterance="cancel" title='Sends "cancel"' hidden>Cancel</button>
    <button type="button" class="btn btn-secondary" data-action="retry" data-utterance="retry" title='Sends "retry"' hidden>Retry signing</button>
    <button type="button" class="btn btn-secondary" data-action="faster" data-utterance="faster" title='Sends "faster"' hidden>Faster fee</button>
    <button type="button" class="btn btn-secondary" data-action="slower" data-utterance="slower" title='Sends "slower"' hidden>Slower fee</button>
    <!-- TCK-LAUNCH-002: the model-download card's Yes/No and the model-free
         quick actions. Visibility comes ONLY from the typed /state
         snapshot's additive model_state NAME (never prose). Their
         data-utterance values are the pump's CANONICAL SLASH COMMANDS —
         deterministic transcript commands dispatched by code, never
         classified by the LLM (there may be no model). -->
    <button type="button" class="btn btn-primary model-only" data-action="model-download" data-utterance="/download" hidden>Yes, download the model</button>
    <button type="button" class="btn btn-secondary model-only" data-action="model-later" data-utterance="/later" hidden>No — show what works without the model</button>
    <button type="button" class="btn btn-secondary quick-only" data-action="qa-balance" data-utterance="/balance" hidden>Show balance</button>
    <button type="button" class="btn btn-secondary quick-only" data-action="qa-receive" data-utterance="/receive" title='Sends "/receive"' hidden>Show receiving address</button>
    <button type="button" class="btn btn-secondary quick-only" data-action="qa-address" data-utterance="/address" title='Sends "/address" — allocates a fresh address instead of reusing the next unused one' hidden>Create new address</button>
    <button type="button" class="btn btn-secondary quick-only" data-action="qa-settings" hidden>Open settings</button>
  </section>
</footer>

</body>
</html>
