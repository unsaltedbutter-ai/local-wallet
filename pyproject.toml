[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-wallet"
version = "0.1.0"
description = "Local-first testnet Bitcoin wallet driven by a grammar-constrained local LLM."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "embit==0.8.0",
    "httpx>=0.27",
    "llama-cpp-python>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
local-wallet = "localwallet.ui.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that hit the live network (opt-in via LOCALWALLET_E2E_LIVE=1 or LOCALWALLET_LLM_LIVE=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"
